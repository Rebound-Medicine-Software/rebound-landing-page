<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Rebound Medicine & Performance</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #1F150C;
    --bg-s:    #291C10;
    --bg-c:    #332314;
    --red:     #CC272A;
    --red-b:   #E03033;
    --red-d:   rgba(204,39,42,0.10);
    --text:    #FBF1E0;
    --t2:      #AD9775;
    --t3:      #70593A;
    --bd:      #4A3420;
    --bd2:     #5C4226;
    --ok:      #8FAE9B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:16px;line-height:1.6;min-height:100vh}
  a{color:var(--red)}
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.01em}

  nav{height:66px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;gap:24px;background:rgba(10,9,8,.97);border-bottom:1px solid var(--bd)}
  .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
  .nav-logo img{height:40px;width:40px;object-fit:contain}
  .nav-logo span{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
  .nav-back{color:var(--t2);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
  .nav-back:hover{color:var(--text)}

  main{max-width:720px;margin:0 auto;padding:60px 24px 100px}

  .card{background:var(--bg-s);border:1px solid var(--bd);border-radius:6px;padding:36px}
  .card + .card{margin-top:20px}

  h1{font-size:clamp(32px,5vw,44px);margin-bottom:10px}
  .lede{color:var(--t2);margin-bottom:28px;font-size:15px}

  label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);margin-bottom:8px}
  input[type=email]{width:100%;background:var(--bg-c);border:1px solid var(--bd2);color:var(--text);padding:13px 14px;border-radius:4px;font-size:15px;font-family:inherit}
  input[type=email]:focus{outline:none;border-color:var(--red)}

  .btn{background:var(--red);color:#fff;border:none;padding:13px 26px;border-radius:4px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .2s;margin-top:16px;width:100%}
  .btn:hover{background:var(--red-b)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-ghost{background:transparent;border:1px solid var(--bd2);color:var(--text)}
  .btn-ghost:hover{background:var(--bg-c)}
  .btn-small{width:auto;padding:9px 16px;font-size:11px;margin-top:0}

  .msg{margin-top:16px;font-size:14px;padding:12px 14px;border-radius:4px}
  .msg-ok{background:rgba(143,174,155,.12);color:var(--ok);border:1px solid rgba(143,174,155,.3)}
  .msg-err{background:var(--red-d);color:#E58B8D;border:1px solid rgba(204,39,42,.3)}

  .greet{font-size:14px;color:var(--t2);margin-bottom:4px}
  .section-title{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:16px}

  .booking-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--bd)}
  .booking-row:last-child{border-bottom:none}
  .b-name{font-weight:600;font-size:15px}
  .b-date{color:var(--t2);font-size:13px;margin-top:2px}
  .b-status{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:3px;white-space:nowrap}
  .b-status.accepted,.b-status.active{background:rgba(143,174,155,.15);color:var(--ok)}
  .b-status.cancelled{background:var(--red-d);color:#E58B8D}
  .b-actions{display:flex;gap:8px;margin-top:8px}

  .payment-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--bd)}
  .payment-row:last-child{border-bottom:none}
  .p-desc{font-size:14px}
  .p-date{color:var(--t2);font-size:12px;margin-top:2px}
  .p-amount{font-weight:600;font-size:15px;white-space:nowrap}

  .empty{color:var(--t3);font-size:14px;padding:12px 0}

  /* Rehab programme (2026-11-17) */
  .prog-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .prog-pill{background:var(--bg-c);border:1px solid var(--bd2);color:var(--t2);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
  .prog-pill.active{background:var(--red);border-color:var(--red);color:#fff}
  .ex-card{border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:12px;background:var(--bg-c)}
  .ex-name{font-weight:600;font-size:15px}
  .ex-dosage{color:var(--t2);font-size:13px;margin-top:3px}
  .ex-cues{color:var(--t2);font-size:13px;margin-top:8px;white-space:pre-wrap}
  .ex-video-box{position:relative;width:100%;padding-top:56.25%;margin-top:10px;border-radius:4px;overflow:hidden;background:#000;display:none}
  .ex-video-box.open{display:block}
  .ex-video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ex-log-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .ex-log-status{font-size:12px;color:var(--ok);font-weight:600}
  .ex-log-status.skipped{color:var(--t2)}
  .ex-felt-input{width:100%;margin-top:8px;background:var(--bg-s);border:1px solid var(--bd2);color:var(--text);padding:9px 11px;border-radius:4px;font-size:13px;font-family:inherit;display:none}
  .ex-felt-input.open{display:block}

  /* Weekly planner (2026-11-19, task #269) -- Today-by-default day view with
     a week nav + 7-day strip for browsing the rest of the programme. */
  .day-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .day-nav .week-label{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
  .day-nav button[data-week-prev],.day-nav button[data-week-next]{background:transparent;border:1px solid var(--bd2);color:var(--text);font-size:12px;padding:6px 10px;border-radius:4px;cursor:pointer}
  .day-nav button:disabled{opacity:.35;cursor:default}
  .today-jump{background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
  .day-strip{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
  .day-chip{flex:0 0 auto;background:var(--bg-c);border:1px solid var(--bd2);color:var(--t2);padding:8px 10px;border-radius:6px;font-size:12px;text-align:center;cursor:pointer;min-width:56px}
  .day-chip .dc-day{font-weight:700;display:block}
  .day-chip .dc-date{font-size:10px;color:var(--t3);display:block;margin-top:2px}
  .day-chip.active{background:var(--red);border-color:var(--red);color:#fff}
  .day-chip.active .dc-date{color:rgba(255,255,255,.75)}
  .day-chip.is-today{box-shadow:0 0 0 2px var(--ok) inset}

  .row-section{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--t2);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
  .row-section:first-child{margin-top:0}
  .row-note{color:var(--t2);font-size:13px;font-style:italic;background:var(--bg-c);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;margin-bottom:12px}

  .group-block{border:1px solid var(--bd2);border-left:3px solid var(--red);border-radius:6px;padding:12px;margin-bottom:12px;background:var(--bg-c)}
  .group-badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--red-d);color:#E58B8D;margin-bottom:8px}
  .group-meta{font-size:12px;color:var(--t2);margin-left:8px}
  .group-block .ex-card{background:var(--bg-s);margin-bottom:8px}
  .group-block .ex-card:last-child{margin-bottom:0}

  .complete-banner{background:rgba(143,174,155,.12);border:1px solid rgba(143,174,155,.3);color:var(--ok);padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:14px}

  .skeleton{opacity:.5}

  #cal-embed-overlay{display:none;position:fixed;inset:0;background:rgba(10,9,8,.85);z-index:1000;align-items:center;justify-content:center;padding:20px}
  #cal-embed-overlay.open{display:flex}
  .cal-embed-box{background:var(--bg-s);border:1px solid var(--bd);border-radius:6px;width:100%;max-width:640px;max-height:85vh;overflow:auto;padding:20px;position:relative}
  .cal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--t2);font-size:22px;cursor:pointer;line-height:1}
  .cal-close:hover{color:var(--text)}
  #cal-embed-target{min-height:400px}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="rebound-logo.png" alt="" onerror="this.style.display='none'">
    <span>Rebound<b style="color:var(--red)">.</b></span>
  </a>
  <a href="index.html" class="nav-back">&larr; Back to site</a>
</nav>

<main>

  <!-- ============================= LOGIN ============================= -->
  <section id="login-view" class="card">
    <h1>My Account</h1>
    <p class="lede">Enter the email you booked with and we'll send you a one-time link to sign in — no password needed.</p>

    <form id="login-form">
      <label for="login-email">Email address</label>
      <input type="email" id="login-email" required autocomplete="email" placeholder="you@example.com">
      <button type="submit" class="btn" id="login-btn">Send me a login link</button>
    </form>

    <div id="login-msg"></div>
  </section>

  <!-- ============================ DASHBOARD =========================== -->
  <section id="dashboard-view" style="display:none">

    <div class="card">
      <p class="greet" id="dash-greeting">&nbsp;</p>
      <h1>Your Bookings</h1>
      <div style="margin-top:20px" id="bookings-list">
        <p class="empty skeleton">Loading your bookings&hellip;</p>
      </div>
    </div>

    <!-- Rehab Programme (2026-11-17, Josh's ask: patients can view their
         assigned exercise programme and log what they actually did) --
         only appears once we know whether there's a programme to show, see
         loadProgrammes() below, which hides this card entirely rather than
         showing an empty state when a patient has never been given one. -->
    <div class="card" id="programme-card" style="display:none">
      <div class="row" style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px">
        <p class="section-title" style="margin-bottom:0">Your Rehab Programme</p>
        <button type="button" class="btn btn-ghost btn-small" id="programme-pdf-btn">Download PDF</button>
      </div>
      <div id="programme-pills" class="prog-pills"></div>
      <div id="programme-week-nav" class="day-nav"></div>
      <div id="programme-day-strip" class="day-strip"></div>
      <div id="programme-exercises">
        <p class="empty skeleton">Loading your programme&hellip;</p>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Payments &amp; Receipts</p>
      <div id="payments-list">
        <p class="empty skeleton">Loading your payments&hellip;</p>
      </div>
    </div>

    <div class="card" style="text-align:center">
      <button type="button" class="btn btn-ghost" id="logout-btn">Sign out</button>
    </div>

  </section>

</main>

<!-- Reschedule/Cancel embed overlay (2026-11-07, Josh's ask: "reschedule/cancel
     from inside the portal") -- intentionally embeds Cal.com's OWN reschedule
     and cancel pages rather than rebuilding that flow against the Cal.com API
     directly. calcom-webhook already listens for Cal.com's native
     BOOKING_RESCHEDULED / BOOKING_CANCELLED events to apply Josh's late-fee
     rules (see schema.sql's late_cancellation_fee_pct/late_reschedule_fee_pct
     columns) -- reusing Cal.com's own flow here means that logic never needs
     touching or duplicating. The patient never leaves this page visually;
     under the hood it's Cal.com's booking-management UI in an iframe, same
     technique the main booking flow on index.html already uses for Cal(" inline"). -->
<div id="cal-embed-overlay">
  <div class="cal-embed-box">
    <button type="button" class="cal-close" id="cal-embed-close" aria-label="Close">&times;</button>
    <div id="cal-embed-target"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Same project, same anon/publishable key as the staff admin app's
// js/config.js -- safe to embed client-side by design (RLS is what actually
// gates access; see schema.sql's "patients read own ..." policies).
const SUPABASE_URL = "https://udoyiifdqwbgihwbosbn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkb3lpaWZkcXdiZ2lod2Jvc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTEzMzksImV4cCI6MjEwMDcyNzMzOX0.Hh9045hcAI4fK2rUtR-qZTHMp3Ab3aNUxFRbvgjTnHE";
const EDGE_FUNCTIONS_URL = "https://udoyiifdqwbgihwbosbn.supabase.co/functions/v1";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function fmtDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function fmtMoney(amountMinor, currency) {
  if (amountMinor == null) return "—";
  const amount = amountMinor / 100;
  return new Intl.NumberFormat("en-GB", { style: "currency", currency: (currency || "GBP").toUpperCase() }).format(amount);
}

// ---------------------------------------------------------------------------
// Login (magic link)
// ---------------------------------------------------------------------------
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const btn = document.getElementById("login-btn");
  const msgEl = document.getElementById("login-msg");
  if (!email) return;

  btn.disabled = true;
  btn.textContent = "Sending…";
  msgEl.innerHTML = "";

  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.href },
  });

  btn.disabled = false;
  btn.textContent = "Send me a login link";

  if (error) {
    msgEl.innerHTML = `<div class="msg msg-err">${escapeHtml(error.message)}</div>`;
    return;
  }
  msgEl.innerHTML = `<div class="msg msg-ok">Check your email — we've sent a link to ${escapeHtml(email)}. Click it to sign in.</div>`;
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await sb.auth.signOut();
  window.location.href = "my-account.html";
});

// ---------------------------------------------------------------------------
// Dashboard
// ---------------------------------------------------------------------------
async function callPatientPortal(action, extra = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("No session");
  const res = await fetch(`${EDGE_FUNCTIONS_URL}/patient-portal`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${session.access_token}`,
    },
    body: JSON.stringify({ action, ...extra }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `Request failed (${res.status})`);
  return json;
}

function renderBookings(bookings) {
  const el = document.getElementById("bookings-list");
  if (!bookings.length) {
    el.innerHTML = `<p class="empty">No bookings yet — <a href="index.html#book">book your first appointment</a>.</p>`;
    return;
  }
  const now = Date.now();
  el.innerHTML = bookings.map((b) => {
    const isUpcoming = b.start_time && new Date(b.start_time).getTime() > now && (b.status || "").toUpperCase() !== "CANCELLED";
    const statusClass = (b.status || "unknown").toLowerCase();
    return `
      <div class="booking-row">
        <div>
          <div class="b-name">${escapeHtml(b.title) || "Appointment"}</div>
          <div class="b-date">${fmtDateTime(b.start_time)}</div>
          ${isUpcoming ? `
            <div class="b-actions">
              <button type="button" class="btn btn-ghost btn-small" data-reschedule="${escapeHtml(b.cal_com_booking_uid)}">Reschedule</button>
              <button type="button" class="btn btn-ghost btn-small" data-cancel="${escapeHtml(b.cal_com_booking_uid)}">Cancel</button>
            </div>
          ` : ""}
        </div>
        <span class="b-status ${escapeHtml(statusClass)}">${escapeHtml(b.status) || "Unknown"}</span>
      </div>
    `;
  }).join("");

  el.querySelectorAll("[data-reschedule]").forEach((btn) => {
    btn.addEventListener("click", () => openCalEmbed(btn.dataset.reschedule, "reschedule"));
  });
  el.querySelectorAll("[data-cancel]").forEach((btn) => {
    btn.addEventListener("click", () => openCalEmbed(btn.dataset.cancel, "cancel"));
  });
}

function renderPayments(payments) {
  const el = document.getElementById("payments-list");
  if (!payments.length) {
    el.innerHTML = `<p class="empty">No payments on file yet.</p>`;
    return;
  }
  el.innerHTML = payments.map((p) => `
    <div class="payment-row">
      <div>
        <div class="p-desc">${escapeHtml(p.description) || (p.kind === "cancellation_fee" ? "Cancellation fee" : "Session payment")}</div>
        <div class="p-date">${fmtDateTime(p.created_at)} &middot; ${escapeHtml(p.status)}</div>
      </div>
      <div style="text-align:right">
        <div class="p-amount">${fmtMoney(p.amount, p.currency)}</div>
        ${p.receipt_url ? `<a href="${escapeHtml(p.receipt_url)}" target="_blank" rel="noopener" style="font-size:12px">View receipt &rarr;</a>` : ""}
      </div>
    </div>
  `).join("");
}

async function loadDashboard() {
  try {
    const { patient, bookings, payments } = await callPatientPortal("get_dashboard");
    document.getElementById("dash-greeting").textContent = patient
      ? `Welcome back, ${patient.first_name}`
      : "Welcome";
    if (!patient) {
      document.getElementById("bookings-list").innerHTML = `<p class="empty">We don't have a booking on file for this email yet — <a href="index.html#book">book your first appointment</a> and this page will fill in automatically.</p>`;
      document.getElementById("payments-list").innerHTML = `<p class="empty">Nothing here yet.</p>`;
      return;
    }
    renderBookings(bookings);
    renderPayments(payments);
  } catch (err) {
    console.error("loadDashboard failed", err);
    document.getElementById("bookings-list").innerHTML = `<p class="empty">Couldn't load your bookings right now — please try refreshing.</p>`;
    document.getElementById("payments-list").innerHTML = "";
  }
  loadProgrammes();
}

// ---------------------------------------------------------------------------
// Rehab programme (2026-11-17) -- "select their programmes and enter
// information to confirm what they did, if they completed the exercise" per
// Josh's own words. The programme card stays hidden entirely (never an
// empty state) when a patient has no active programme, since most patients
// won't have one -- see loadProgrammes() below.
//
// WEEKLY PLANNER (2026-11-19, task #269) -- defaults to "Today" (viewWeek/
// viewDay set from the get_programmes response's today_week_number/
// today_day_number) with a week nav + 7-day strip to browse the rest of
// the programme. Rows can be a standalone exercise, a Section/Note divider,
// or a Superset/Circuit/AMRAP/EMOM/RFT group -- all shaped server-side by
// the patient-portal Edge Function (see its shapeDayRows), so this file
// only has to render what it's given.
// ---------------------------------------------------------------------------
let currentProgrammes = [];
let currentProgrammeId = null;
let viewWeek = null;
let viewDay = null;
let currentCustomFieldDefs = []; // id->label lookup for any custom dosage fields Josh has added, from get_programmes' custom_field_defs

// Same id-extraction approach as js/exercise-picker.js in the staff app --
// kept as a separate copy here rather than a shared <script src>, since
// this repo (rebound-landing-page) is a different deploy target/site to
// the staff app (patient-portal) and the two have never shared JS files.
function myAccountYoutubeId(url) {
  if (!url || typeof url !== "string") return null;
  const patterns = [
    /youtu\.be\/([A-Za-z0-9_-]{11})/,
    /youtube\.com\/watch\?.*\bv=([A-Za-z0-9_-]{11})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{11})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/,
  ];
  for (const re of patterns) {
    const m = url.match(re);
    if (m) return m[1];
  }
  return null;
}

async function loadProgrammes() {
  const cardEl = document.getElementById("programme-card");
  try {
    const { programmes, custom_field_defs } = await callPatientPortal("get_programmes");
    currentCustomFieldDefs = custom_field_defs || [];
    currentProgrammes = programmes || [];
    if (!currentProgrammes.length) {
      cardEl.style.display = "none";
      return;
    }
    cardEl.style.display = "block";
    if (!currentProgrammeId || !currentProgrammes.find((p) => p.id === currentProgrammeId)) {
      selectProgramme(currentProgrammes[0].id);
    } else {
      // Reload without resetting where the patient was browsing (e.g. right
      // after they log an exercise, which calls loadProgrammes() again).
      renderProgrammePills();
      renderDayNav();
      renderDayStrip();
      renderProgrammeExercises();
    }
  } catch (err) {
    console.error("loadProgrammes failed", err);
    // Don't hide the card on a real error (vs. "no programme") -- a
    // patient who knows they have one should see that something went
    // wrong, not have it silently vanish.
    cardEl.style.display = "block";
    document.getElementById("programme-pills").innerHTML = "";
    document.getElementById("programme-week-nav").innerHTML = "";
    document.getElementById("programme-day-strip").innerHTML = "";
    document.getElementById("programme-exercises").innerHTML = `<p class="empty">Couldn't load your programme right now — please try refreshing.</p>`;
  }
}

// Switching programmes jumps back to THAT programme's own "today" --
// different programmes can have different started_at dates, so one
// programme's today is rarely the same week/day position as another's.
function selectProgramme(id) {
  currentProgrammeId = id;
  const programme = currentProgrammes.find((p) => p.id === id);
  viewWeek = programme ? programme.today_week_number : 1;
  viewDay = programme ? programme.today_day_number : 1;
  renderProgrammePills();
  renderDayNav();
  renderDayStrip();
  renderProgrammeExercises();
}

function renderProgrammePills() {
  const pillsEl = document.getElementById("programme-pills");
  if (currentProgrammes.length < 2) { pillsEl.innerHTML = ""; return; }
  pillsEl.innerHTML = currentProgrammes.map((p) => `
    <button type="button" class="prog-pill${p.id === currentProgrammeId ? " active" : ""}" data-prog="${p.id}">${escapeHtml(p.name)}</button>
  `).join("");
  pillsEl.querySelectorAll("[data-prog]").forEach((btn) => {
    btn.addEventListener("click", () => selectProgramme(btn.dataset.prog));
  });
}

function currentProgramme() { return currentProgrammes.find((p) => p.id === currentProgrammeId); }
function currentWeekObj() {
  const programme = currentProgramme();
  return programme ? programme.weeks.find((w) => w.week_number === viewWeek) : null;
}
function currentDayObj() {
  const week = currentWeekObj();
  return week ? week.days.find((d) => d.day_number === viewDay) : null;
}

function formatChipDate(dateStr) {
  const d = new Date(`${dateStr}T00:00:00Z`);
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
}

function renderDayNav() {
  const programme = currentProgramme();
  const navEl = document.getElementById("programme-week-nav");
  if (!programme) { navEl.innerHTML = ""; return; }
  const isToday = viewWeek === programme.today_week_number && viewDay === programme.today_day_number;
  navEl.innerHTML = `
    <button type="button" data-week-prev ${viewWeek <= 1 ? "disabled" : ""}>&larr; Prev week</button>
    <span class="week-label">Week ${viewWeek} of ${programme.total_weeks}${isToday ? "" : ` &middot; <button type="button" class="today-jump" data-jump-today>Jump to today</button>`}</span>
    <button type="button" data-week-next ${viewWeek >= programme.total_weeks ? "disabled" : ""}>Next week &rarr;</button>
  `;
  const prevBtn = navEl.querySelector("[data-week-prev]");
  if (prevBtn) prevBtn.addEventListener("click", () => { viewWeek -= 1; renderDayNav(); renderDayStrip(); renderProgrammeExercises(); });
  const nextBtn = navEl.querySelector("[data-week-next]");
  if (nextBtn) nextBtn.addEventListener("click", () => { viewWeek += 1; renderDayNav(); renderDayStrip(); renderProgrammeExercises(); });
  const jumpBtn = navEl.querySelector("[data-jump-today]");
  if (jumpBtn) jumpBtn.addEventListener("click", () => {
    viewWeek = programme.today_week_number;
    viewDay = programme.today_day_number;
    renderDayNav(); renderDayStrip(); renderProgrammeExercises();
  });
}

function renderDayStrip() {
  const programme = currentProgramme();
  const stripEl = document.getElementById("programme-day-strip");
  const week = currentWeekObj();
  if (!programme || !week) { stripEl.innerHTML = ""; return; }
  stripEl.innerHTML = week.days.map((d) => {
    const isToday = viewWeek === programme.today_week_number && d.day_number === programme.today_day_number;
    const isActive = d.day_number === viewDay;
    return `
      <button type="button" class="day-chip${isActive ? " active" : ""}${isToday ? " is-today" : ""}" data-day="${d.day_number}">
        <span class="dc-day">Day ${d.day_number}</span>
        <span class="dc-date">${formatChipDate(d.date)}</span>
      </button>
    `;
  }).join("");
  stripEl.querySelectorAll("[data-day]").forEach((btn) => {
    btn.addEventListener("click", () => { viewDay = Number(btn.dataset.day); renderDayStrip(); renderProgrammeExercises(); });
  });
}

// One exercise card's markup -- used both standalone and nested inside a
// group block, which is why wiring (video/log) below just queries for
// every ".ex-card" regardless of nesting rather than two separate passes.
function exerciseCardHtml(ex) {
  const videoId = myAccountYoutubeId(ex.video_url);
  // sets/reps falls back to the old combined sets_reps string for any row
  // saved before the split (2026-11-20, Josh's ask) -- see schema.sql's
  // comment on why sets_reps itself is never migrated.
  const setsReps = (ex.sets || ex.reps) ? [ex.sets, ex.reps].filter(Boolean).join(" x ") : (ex.sets_reps || null);
  const customBits = Object.entries(ex.custom_fields || {})
    .filter(([, v]) => v)
    .map(([id, v]) => {
      const def = currentCustomFieldDefs.find((d) => d.id === id);
      return def ? `${def.label} ${v}` : null;
    })
    .filter(Boolean);
  const dosageBits = [
    setsReps,
    ex.tempo ? `tempo ${ex.tempo}` : null,
    ex.rest ? `rest ${ex.rest}` : null,
    ex.hold ? `hold ${ex.hold}` : null,
    ex.resistance || null,
    ex.side || null,
    ex.distance || null,
    ...customBits,
  ].filter(Boolean);
  const log = ex.log;
  // Video now always expanded (2026-11-20, Josh's ask) rather than behind a
  // "Watch video" tap -- the iframe is in the DOM straight away so there's
  // no click needed to see it, but autoplay is deliberately left off (a
  // day with several exercises would otherwise be several videos trying to
  // play sound at once) and loading="lazy" means the browser doesn't
  // actually fetch/decode it until it's scrolled near the viewport, so this
  // doesn't cost load time for exercises further down the day's list.
  return `
    <div class="ex-card" data-ex="${ex.id}">
      <div class="ex-name">${escapeHtml(ex.name || "Exercise")}</div>
      ${dosageBits.length ? `<div class="ex-dosage">${escapeHtml(dosageBits.join(" · "))}</div>` : ""}
      ${ex.coaching_cues ? `<div class="ex-cues">${escapeHtml(ex.coaching_cues)}</div>` : ""}
      ${ex.notes ? `<div class="ex-cues">${escapeHtml(ex.notes)}</div>` : ""}
      ${videoId ? `
        <div class="ex-video-box open">
          <iframe src="https://www.youtube.com/embed/${videoId}" title="${escapeHtml(ex.name || "Exercise video")}" frameborder="0" allow="encrypted-media" allowfullscreen loading="lazy"></iframe>
        </div>
      ` : ""}

      <div class="ex-log-row" data-log-controls>
        ${log
          ? `<span class="ex-log-status${log.completed ? "" : " skipped"}">${log.completed ? "✓ Logged done" : "Logged as skipped"}</span>
             <button type="button" class="btn btn-ghost btn-small" data-log-again>Log again</button>`
          : `<button type="button" class="btn btn-ghost btn-small" data-log="done">✓ Done</button>
             <button type="button" class="btn btn-ghost btn-small" data-log="skip">Skip</button>`}
      </div>
      <textarea class="ex-felt-input" placeholder="How did it feel? (optional)" data-felt></textarea>
    </div>
  `;
}

function renderProgrammeExercises() {
  const listEl = document.getElementById("programme-exercises");
  const programme = currentProgramme();
  const day = currentDayObj();
  if (!programme || !day) {
    listEl.innerHTML = `<p class="empty">Nothing in this programme yet.</p>`;
    return;
  }

  const completeBanner = programme.is_complete
    ? `<p class="complete-banner">You've reached the end of this ${programme.total_weeks}-week programme — nice work. You can still look back over any week above.</p>`
    : "";

  if (!day.rows.length) {
    listEl.innerHTML = `${completeBanner}<p class="empty">Rest day — nothing scheduled.</p>`;
    return;
  }

  listEl.innerHTML = completeBanner + day.rows.map((row) => {
    if (row.kind === "section") return `<div class="row-section">${escapeHtml(row.label)}</div>`;
    if (row.kind === "note") return `<div class="row-note">${escapeHtml(row.label)}</div>`;
    if (row.kind === "group") {
      const meta = row.format_meta || {};
      let metaText = "";
      if (row.group_type === "amrap") metaText = `${meta.duration_minutes || 20} min AMRAP`;
      else if (row.group_type === "emom") metaText = `Every ${meta.interval_seconds || 60}s &times; ${meta.rounds || 10}`;
      else if (row.group_type === "rft") metaText = `${escapeHtml(meta.target || "")} for time${meta.time_cap_minutes ? ` &middot; cap ${meta.time_cap_minutes} min` : ""}`;
      return `
        <div class="group-block">
          <span class="group-badge">${escapeHtml((row.group_type || "").toUpperCase())}</span>
          ${metaText ? `<span class="group-meta">${metaText}</span>` : ""}
          ${row.exercises.map(exerciseCardHtml).join("")}
        </div>
      `;
    }
    return exerciseCardHtml(row);
  }).join("");

  listEl.querySelectorAll("[data-log-again]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".ex-card");
      card.querySelector("[data-log-controls]").innerHTML = `
        <button type="button" class="btn btn-ghost btn-small" data-log="done">✓ Done</button>
        <button type="button" class="btn btn-ghost btn-small" data-log="skip">Skip</button>
      `;
      wireLogButtons(card);
    });
  });

  listEl.querySelectorAll(".ex-card").forEach((card) => wireLogButtons(card));
}

// ---------------------------------------------------------------------------
// Download PDF (task #271) -- same browser print-to-PDF approach as the
// admin side (js/patient-programme.js's ppgOpenPdfWindow): no library, no
// Edge Function, just a clean print-only tab with "Save as PDF" as a
// built-in print destination. Reads straight off the already-shaped
// weeks/days/rows the patient-portal function returns -- no re-grouping
// needed here.
// ---------------------------------------------------------------------------
function myAccountPdfRenderExercise(ex) {
  const setsReps = (ex.sets || ex.reps) ? [ex.sets, ex.reps].filter(Boolean).join(" x ") : (ex.sets_reps || null);
  const dosageBits = [setsReps, ex.tempo ? `tempo ${ex.tempo}` : null, ex.rest ? `rest ${ex.rest}` : null].filter(Boolean);
  return `
    <div class="pdf-ex">
      <div class="pdf-ex-name">${escapeHtml(ex.name || "Exercise")}</div>
      ${dosageBits.length ? `<div class="pdf-ex-dosage">${escapeHtml(dosageBits.join(" · "))}</div>` : ""}
      ${ex.notes ? `<div class="pdf-ex-notes">${escapeHtml(ex.notes)}</div>` : ""}
    </div>
  `;
}

function myAccountOpenPdfWindow() {
  const programme = currentProgramme();
  if (!programme) return;

  const weeksHtml = programme.weeks.map((week) => {
    const daysHtml = week.days.map((day) => {
      if (!day.rows.length) return "";
      const rowsHtml = day.rows.map((row) => {
        if (row.kind === "section") return `<div class="pdf-section">${escapeHtml(row.label)}</div>`;
        if (row.kind === "note") return `<div class="pdf-note">${escapeHtml(row.label)}</div>`;
        if (row.kind === "group") {
          return `<div class="pdf-group"><span class="pdf-group-badge">${escapeHtml((row.group_type || "").toUpperCase())}</span>${row.exercises.map(myAccountPdfRenderExercise).join("")}</div>`;
        }
        return myAccountPdfRenderExercise(row);
      }).join("");
      return `<div class="pdf-day"><h3>Day ${day.day_number} &middot; ${formatChipDate(day.date)}</h3>${rowsHtml}</div>`;
    }).join("");
    if (!daysHtml.trim()) return "";
    return `<section class="pdf-week"><h2>Week ${week.week_number}</h2>${daysHtml}</section>`;
  }).join("");

  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(programme.name)}</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;color:#222;padding:24px;max-width:760px;margin:0 auto;}
  h1{font-size:22px;margin-bottom:2px;}
  .pdf-sub{color:#666;font-size:13px;margin-bottom:24px;}
  .pdf-week{margin-bottom:22px;page-break-inside:avoid;}
  .pdf-week h2{font-size:16px;border-bottom:2px solid #CC272A;padding-bottom:4px;}
  .pdf-day{margin:10px 0 14px 10px;}
  .pdf-day h3{font-size:13px;color:#555;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
  .pdf-ex{margin-bottom:8px;padding-left:10px;border-left:3px solid #E3E3E3;}
  .pdf-ex-name{font-weight:bold;font-size:13px;}
  .pdf-ex-dosage{color:#555;font-size:12px;}
  .pdf-ex-notes{color:#555;font-size:12px;font-style:italic;}
  .pdf-section{font-weight:bold;font-size:13px;text-transform:uppercase;color:#777;margin:10px 0 4px;}
  .pdf-note{font-style:italic;color:#555;font-size:12px;background:#FAFAFA;padding:6px 8px;border-radius:4px;margin-bottom:8px;}
  .pdf-group{border:1px solid #E3E3E3;border-left:3px solid #CC272A;border-radius:4px;padding:8px;margin-bottom:8px;}
  .pdf-group-badge{font-size:11px;font-weight:bold;text-transform:uppercase;color:#B4780A;}
  @media print { body{padding:0;} }
</style>
</head><body>
  <h1>${escapeHtml(programme.name)}</h1>
  <div class="pdf-sub">${programme.total_weeks} week${programme.total_weeks === 1 ? "" : "s"} &middot; Rebound Medicine &amp; Performance</div>
  ${weeksHtml || "<p>No exercises yet.</p>"}
</body></html>`;

  const win = window.open("", "_blank");
  if (!win) { alert("Please allow pop-ups to download the PDF."); return; }
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(() => { try { win.print(); } catch (e) { /* ignore */ } }, 300);
}

document.getElementById("programme-pdf-btn").addEventListener("click", myAccountOpenPdfWindow);

function wireLogButtons(card) {
  card.querySelectorAll("[data-log]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const feltEl = card.querySelector("[data-felt]");
      // First click on either button just reveals the "how did it feel"
      // box and arms this button as the one that will actually submit --
      // keeps the common case (tap Done, you're finished) to one tap while
      // still offering the optional note before it's sent.
      if (!feltEl.classList.contains("open")) {
        feltEl.classList.add("open");
        feltEl.dataset.pendingCompleted = btn.dataset.log === "done" ? "1" : "0";
        card.querySelectorAll("[data-log]").forEach((b) => { b.textContent = b === btn ? "Save" : ""; if (b !== btn) b.style.display = "none"; });
        return;
      }
      btn.disabled = true;
      try {
        // Logs against the date of the day currently being viewed, not
        // necessarily today -- lets a patient browsing an earlier day in
        // the week log it retroactively. See patient-portal's log_exercise
        // action, which rejects a future date.
        const day = currentDayObj();
        await callPatientPortal("log_exercise", {
          patient_programme_exercise_id: card.dataset.ex,
          completed: feltEl.dataset.pendingCompleted === "1",
          how_it_felt: feltEl.value,
          log_date: day ? day.date : undefined,
        });
        loadProgrammes();
      } catch (err) {
        alert(err.message || "Couldn't save that -- try again.");
        btn.disabled = false;
      }
    });
  });
}

// ---------------------------------------------------------------------------
// Reschedule/Cancel — embeds Cal.com's own hosted page for this booking.
// Cal.com's booking-management URLs are keyed by booking uid:
//   https://cal.com/booking/<uid>?cancel=true|reschedule=true
// ---------------------------------------------------------------------------
function openCalEmbed(bookingUid, mode) {
  if (!bookingUid) return;
  const overlay = document.getElementById("cal-embed-overlay");
  const target = document.getElementById("cal-embed-target");
  const param = mode === "cancel" ? "cancel=true" : "reschedule=true";
  target.innerHTML = `<iframe src="https://cal.com/booking/${encodeURIComponent(bookingUid)}?${param}" style="width:100%;height:70vh;border:0;border-radius:4px;background:#fff" title="${mode === "cancel" ? "Cancel" : "Reschedule"} booking"></iframe>`;
  overlay.classList.add("open");
}
document.getElementById("cal-embed-close").addEventListener("click", () => {
  document.getElementById("cal-embed-overlay").classList.remove("open");
  document.getElementById("cal-embed-target").innerHTML = "";
  // Refresh in case the patient just rescheduled/cancelled inside the embed.
  loadDashboard();
});

// ---------------------------------------------------------------------------
// Boot: show login or dashboard depending on session state, and react to a
// magic-link redirect landing back on this exact page.
// ---------------------------------------------------------------------------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById("login-view").style.display = "none";
    document.getElementById("dashboard-view").style.display = "block";
    loadDashboard();
  }
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" && session) {
    document.getElementById("login-view").style.display = "none";
    document.getElementById("dashboard-view").style.display = "block";
    loadDashboard();
  }
  if (event === "SIGNED_OUT") {
    document.getElementById("login-view").style.display = "block";
    document.getElementById("dashboard-view").style.display = "none";
  }
});

boot();
</script>
